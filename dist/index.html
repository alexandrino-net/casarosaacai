<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Casa Rosa Açaí | PDV</title><style>body{color-scheme:light dark;background:light-dark(#f8e8f1,#211622);margin:0;padding:clamp(8px,3vw,36px)}#rosa-pdv{max-width:1180px;margin:auto}</style></head><body><div id="rosa-pdv">
<header><b>✿ Casa Rosa Açaí</b><span>PDV · Modo demonstração</span></header>
<main><section><h1>Nova venda</h1><div class="filters" aria-label="Categorias"></div><div class="products"></div></section>
<aside><h2>Pedido de balcão</h2><div class="items"></div><div class="total" aria-live="polite"><b>Total</b><strong></strong></div>
<div class="pay" hidden><label>Forma de pagamento <select><option>Pix</option><option>Cartão</option><option>Dinheiro</option></select></label></div>
<button class="finish">Ir para pagamento</button><p role="status"></p></aside></main>
</div>
<style>
#rosa-pdv{color-scheme:light dark;--ink:light-dark(#382039,#ffeaf7);--paper:light-dark(#fff4f8,#271b28);--panel:light-dark(#fff,#382839);--line:light-dark(#edd8e5,#60435d);--brand:light-dark(#8b245e,#ffacd7);--on:light-dark(#fff,#36142a);font:15px/1.45 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#rosa-pdv *{box-sizing:border-box}#rosa-pdv header{display:flex;gap:16px;align-items:center;padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--line)}#rosa-pdv header b{color:var(--brand);font-size:20px}#rosa-pdv header span{font-size:13px}#rosa-pdv main{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:20px;padding:22px}#rosa-pdv h1,#rosa-pdv h2{margin:0 0 14px}#rosa-pdv h1{font-size:30px}#rosa-pdv h2{font-size:19px}#rosa-pdv button,#rosa-pdv select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}#rosa-pdv button:disabled{opacity:.55}#rosa-pdv .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}#rosa-pdv [aria-pressed=true],#rosa-pdv .finish{background:var(--brand);color:var(--on);border-color:transparent}#rosa-pdv .products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#rosa-pdv .product{text-align:left;padding:13px;display:grid;gap:6px}#rosa-pdv .product img{display:block;width:min(100%,84px);margin-inline:auto;height:auto;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--paper)}#rosa-pdv .product strong{color:var(--brand)}#rosa-pdv aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start}#rosa-pdv .row,#rosa-pdv .total{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding:10px 0}#rosa-pdv .row span{display:block}#rosa-pdv .row button{padding:6px;min-width:32px}#rosa-pdv .total strong{font-size:22px}#rosa-pdv .finish{width:100%}#rosa-pdv p:empty{display:none}#rosa-pdv .pay{margin-bottom:10px}#rosa-pdv .pay select{width:100%;margin-top:4px}@media(max-width:650px){#rosa-pdv main{grid-template-columns:1fr;padding:14px}}
@media(max-width:460px){#rosa-pdv .products{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>
(()=>{
const root=document.getElementById('rosa-pdv');
const products=[
['Açaí 300 ml',1600,'Açaí','acai-300'],['Açaí 500 ml',2200,'Açaí','acai-500'],['Açaí 700 ml',2900,'Açaí','acai-700'],
['Morango',400,'Adicionais','morango'],['Granola',300,'Adicionais','granola'],['Água mineral',400,'Bebidas','agua-mineral']];
const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>money.format(n/100);
const find=s=>root.querySelector(s);
const cart=new Map();
let category='Todos';
const filters=['Todos','Açaí','Adicionais','Bebidas'];
const payment=find('.pay');
const finish=find('.finish');
const status=find('[role=status]');
function catalog(){
find('.filters').innerHTML=filters.map(c=>`<button type="button" data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('');
find('.products').innerHTML=products.map(([name,price,group,photo],i)=>category==='Todos'||category===group?`<button type="button" class="product" data-add="${i}" aria-label="Adicionar ${name}, ${brl(price)}"><img src="./produtos/${photo}.webp" alt="" width="400" height="400"><b>${name}</b><strong>${brl(price)} ＋</strong></button>`:'').join('');
}
function order(){
find('.items').innerHTML=[...cart].map(([i,qty])=>`<div class="row"><div><b>${products[i][0]}</b><span>${brl(products[i][1]*qty)}</span></div><div><button type="button" data-remove="${i}" aria-label="Retirar uma unidade de ${products[i][0]}">−</button> ${qty} <button type="button" data-add="${i}" aria-label="Adicionar uma unidade de ${products[i][0]}">+</button></div></div>`).join('')||'<p>Nenhum item no pedido.</p>';
find('.total strong').textContent=brl([...cart].reduce((sum,[i,qty])=>sum+products[i][1]*qty,0));
if(!cart.size)payment.hidden=true;
finish.disabled=!cart.size;
finish.textContent=payment.hidden?'Ir para pagamento':'Confirmar venda simulada';
}
root.addEventListener('click',e=>{
const button=e.target.closest('button');
if(!button)return;
const {category:selected,add,remove}=button.dataset;
if(selected){category=selected;catalog();[...find('.filters').children].find(b=>b.dataset.category===selected).focus();return;}
if(button===finish){
if(payment.hidden){payment.hidden=false;order();find('select').focus();return;}
status.textContent='Venda simulada concluída · '+find('select').value;
cart.clear();
}else{
const i=Number(add??remove);
const qty=(cart.get(i)||0)+(add===undefined?-1:1);
if(qty)cart.set(i,qty);else cart.delete(i);
status.textContent='';
}
const rowButton=button.closest('.items');
order();
if(rowButton)(find(add===undefined?'[data-remove="'+remove+'"]':'.items [data-add="'+add+'"]')||find('.product')).focus();
});
catalog();order();
})();
</script>
</body></html>
